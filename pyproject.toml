[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity_discovery"
version = "0.1.0"
description = "Deterministic public opportunity-discovery engine producing versioned lead packets for downstream private review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "opportunity-discovery maintainers" }]
keywords = ["internships", "opportunities", "discovery", "lead-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "feedparser>=6.0,<7.0",
    "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "types-beautifulsoup4",
]

[project.scripts]
opdisc = "opportunity_discovery.cli:main"

[project.urls]
Homepage = "https://github.com/derek-l8/opportunity-discovery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opportunity_discovery = ["migrations/*.sql"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["opportunity_discovery"]
strict_optional = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that hit live public endpoints (deselect with -m 'not live')",
]

[tool.coverage.run]
source = ["src/opportunity_discovery"]
omit = ["*/migrations/*"]
