name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff format
        run: ruff format --check src tests scripts/demo_workspace.py
      - name: Ruff lint
        run: ruff check src tests scripts/demo_workspace.py
      - name: Mypy
        run: mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      - name: Tests (deterministic; no network)
        run: python -m pytest -q -m "not live" --cov=opportunity_discovery --cov-report=term-missing
      - name: Publication audit
        run: opdisc audit .
